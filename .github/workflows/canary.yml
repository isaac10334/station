name: Station canary

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Publish one channel completely before the next build reads its previous archive.
concurrency:
  group: station-canary
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2025
    env:
      STATION_VERSION: 0.1.0-canary.${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run desktop:prepare
      - run: bun run typecheck
      - run: bun test tests
      - run: bun run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: station-windows
          path: artifacts/*
          if-no-files-found: error

  publish:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: station-windows
          path: artifacts
      - name: Publish immutable build and advance canary
        shell: bash
        env:
          BUILD_TAG: canary-${{ github.run_number }}-${{ github.run_attempt }}
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh release create "$BUILD_TAG" artifacts/* --target "$BUILD_COMMIT" \
            --title "Station $BUILD_TAG" --prerelease --latest=false \
            --notes "Windows canary built from $BUILD_COMMIT."
          if ! gh release view canary >/dev/null 2>&1; then
            gh release create canary --target "$BUILD_COMMIT" --title "Station canary" \
              --prerelease --latest=false --notes "Automatically updated from main."
          fi
          # Retain old hash-named patches for chained delta updates.
          # Upload payloads first; metadata points only at already-present files.
          find artifacts -type f ! -name '*-update.json' -print0 | \
            xargs -0 gh release upload canary --clobber
          gh release upload canary artifacts/*-update.json --clobber
          gh release edit canary --notes "Windows canary from $BUILD_COMMIT. Archived build: $BUILD_TAG."
