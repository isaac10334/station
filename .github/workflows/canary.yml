name: Station canary

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_canary:
        description: 'Publish public canary after verification (explicit authorization)'
        type: boolean
        default: false

permissions:
  contents: read

# Publish one channel completely before the next build reads its previous archive.
concurrency:
  group: station-canary
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      STATION_VERSION: 0.1.0-canary.${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run desktop:prepare
      - name: Install pinned Component and scripting toolchain
        run: rustup toolchain install nightly-2026-09-08 --profile minimal --target wasm32-wasip2
      - run: bun run typecheck
      - run: bun run check:packages
      - run: bun run test
      - run: bun run desktop:build
      - run: bun apps/station/scripts/verify-browser-native.ts
      - run: bun run prepare:release
      - name: Install and launch the packaged app
        shell: pwsh
        run: |
          $env:ELECTROBUN_INSTALLER_UI_AUTOCLOSE = '1'
          $env:STATION_BROWSER_VERIFY = '1'
          $installer = Join-Path $pwd 'apps/station/build/canary-win-x64/Station-Setup-canary.exe'
          $installation = Start-Process -FilePath $installer -PassThru -WindowStyle Hidden
          # The installer launches Station; PowerShell -Wait also waits for that
          # child app. Wait only for the installer process itself.
          if (!$installation.WaitForExit(60000)) { throw 'Installer did not exit within one minute' }
          if ($installation.ExitCode -ne 0) { throw "Installer failed: $($installation.ExitCode)" }
          $installRoot = Join-Path $env:LOCALAPPDATA 'com.isaacharvey.station/canary'
          if (!(Test-Path (Join-Path $installRoot '.electrobun-uninstall.json'))) {
            throw 'Installer did not register the installed app'
          }
          try {
            $page = $null
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try { $page = Invoke-WebRequest 'http://127.0.0.1:43157/'; break }
              catch { Start-Sleep -Seconds 1 }
            }
            if (!$page -or $page.StatusCode -ne 200 -or $page.RawContentLength -lt 1000000) {
              throw 'Installed Station did not serve its packaged frontend'
            }
            $frontendPath = Join-Path $env:RUNNER_TEMP 'station-index.html'
            Invoke-WebRequest 'http://127.0.0.1:43157/' -OutFile $frontendPath
            # Public loopback HTML contains only the native-root marker. The
            # owner secret is injected through the native view after navigation.
            # Remove the public marker before comparing the packaged bytes.
            $served = [IO.File]::ReadAllText($frontendPath)
            if ($served.Contains('<meta name="station-desktop"')) {
              throw 'Installed HTTP page leaked its owner credential'
            }
            $bootstrap = '<meta name="station-native-root" content="1">'
            if ([regex]::Matches($served, $bootstrap).Count -ne 1) {
              throw 'Installed desktop bootstrap is missing or duplicated'
            }
            [IO.File]::WriteAllText($frontendPath, [regex]::Replace($served, $bootstrap, ''), [Text.UTF8Encoding]::new($false))
            if ((Get-FileHash $frontendPath).Hash -ne (Get-FileHash 'apps/station/dist/index.html').Hash) {
              throw 'Installed frontend differs from the current build'
            }
            $discovery = $null
            for ($attempt = 0; $attempt -lt 50; $attempt++) {
              $discovery = Invoke-RestMethod 'http://127.0.0.1:43157/api/control/discover'
              if ($discovery.connected -and $discovery.rendererId) { break }
              Start-Sleep -Milliseconds 200
            }
            if (!$discovery.connected -or !$discovery.rendererId) {
              throw 'Installed native root did not authenticate and register its renderer'
            }
            $worker = Invoke-WebRequest 'http://127.0.0.1:43157/api/component/worker.js'
            if ($worker.StatusCode -ne 200 -or $worker.RawContentLength -lt 1000) {
              throw 'Installed Component worker is missing'
            }
            $workerPath = Join-Path $env:RUNNER_TEMP 'station-worker.js'
            Invoke-WebRequest 'http://127.0.0.1:43157/api/component/worker.js' -OutFile $workerPath
            if ((Get-FileHash $workerPath).Hash -ne (Get-FileHash 'apps/station/dist/desktop/component-worker.js').Hash) {
              throw 'Installed worker differs from the current build'
            }
            $translatorPath = Join-Path $env:RUNNER_TEMP 'station-translator.wasm'
            Invoke-WebRequest 'http://127.0.0.1:43157/api/component/translator.wasm' -OutFile $translatorPath
            if ((Get-FileHash $translatorPath).Hash -ne (Get-FileHash 'apps/station/dist/desktop/translator.wasm').Hash) {
              throw 'Installed translator differs from the packaged bytes'
            }
            # Exercise the real updater's startup check and download in a managed
            # install. Applying still requires the user's Restart to update action.
            $metadataUrl = 'https://github.com/isaac10334/station/releases/download/canary/canary-win-x64-update.json'
            $available = $null
            try { $available = Invoke-RestMethod $metadataUrl }
            catch {
              if ([int]$_.Exception.Response.StatusCode -ne 404) { throw }
              Write-Host 'First release: no previous canary exists to download'
            }
            if ($available) {
              $preparedPath = Join-Path $installRoot 'self-extraction/.electrobun-prepared-update.json'
              $prepared = $null
              for ($attempt = 0; $attempt -lt 120; $attempt++) {
                if (Test-Path $preparedPath) {
                  $candidate = Get-Content $preparedPath -Raw | ConvertFrom-Json
                  if ($candidate.hash -eq $available.hash) { $prepared = $candidate; break }
                }
                Start-Sleep -Seconds 1
              }
              if (!$prepared -or !(Test-Path $prepared.retained_tar_path)) {
                throw 'Installed updater did not prepare the published canary within two minutes'
              }
            }
            # Real HWND close/hide/restore, native menu dispatch, installed icon
            # resources and graceful Quit. This does not apply a public update.
            $browserReportPath = Join-Path $installRoot 'browser-acceptance.json'
            $browserReport = $null
            for ($attempt = 0; $attempt -lt 90; $attempt++) {
              if (Test-Path $browserReportPath) { $browserReport = Get-Content $browserReportPath -Raw | ConvertFrom-Json; break }
              Start-Sleep -Seconds 1
            }
            if (!$browserReport -or !$browserReport.passed) { throw "Installed native browser acceptance failed: $($browserReport.error)" }
            ./apps/station/scripts/verify-installed-desktop.ps1 -InstallRoot $installRoot
          } finally {
            $appBin = Join-Path $installRoot 'app/bin'
            Get-Process | Where-Object { $_.Path -and $_.Path.StartsWith($appBin, [StringComparison]::OrdinalIgnoreCase) } |
              Stop-Process -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: station-windows
          path: apps/station/artifacts/*
          if-no-files-found: error

  publish:
    needs: windows
    if: github.event_name == 'push' || inputs.publish_canary == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: station-windows
          path: artifacts
      - name: Publish immutable build and advance canary
        shell: bash
        env:
          BUILD_TAG: canary-${{ github.run_number }}-${{ github.run_attempt }}
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh release create "$BUILD_TAG" artifacts/* --target "$BUILD_COMMIT" \
            --title "Station $BUILD_TAG" --prerelease --latest=false \
            --notes "Windows canary built from $BUILD_COMMIT."
          if ! gh release view canary >/dev/null 2>&1; then
            gh release create canary --target "$BUILD_COMMIT" --title "Station canary" \
              --prerelease --latest=false --notes "Automatically updated from main."
          fi
          # Retain old hash-named patches for chained delta updates.
          # Upload payloads first; metadata points only at already-present files.
          find artifacts -type f ! -name '*-update.json' -print0 | \
            xargs -0 gh release upload canary --clobber
          gh release upload canary artifacts/*-update.json --clobber
          gh api --method PATCH "repos/$GH_REPO/git/refs/tags/canary" \
            -f sha="$BUILD_COMMIT" -F force=true
          gh release edit canary --notes "Windows canary from $BUILD_COMMIT. Archived build: $BUILD_TAG."
